name: Guardian Runtime CI

on:
  push:
    branches:
      - manus-expanded-m1-safety-contracts
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax and runtime checks
        run: npm run check
      - name: Test Guardian contracts
        run: npm test
