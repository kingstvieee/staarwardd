name: Amazon Alexa MCP Verify

on:
  push:
    branches:
      - amazon-alexa-mcp
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run amazon:test
