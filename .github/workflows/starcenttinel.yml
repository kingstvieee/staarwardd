name: StarCenttinel validation
on:
  push:
    branches: [feature/starcenttinel-foundation]
  pull_request:
    paths:
      - 'sentinel/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/starcenttinel.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
